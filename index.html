<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking Natación - Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --excel-header-bg: #1f4e79;
      --excel-btn-bg: #b4c6e7;
      --excel-btn-active: #2f5597;
      --excel-border: #8ea9db;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      color: #333;
    }

    .top-bar {
      background-color: #e5e5e5;
      color: #666;
      text-align: center;
      padding: 6px 0;
      font-size: 13px;
      width: 100%;
    }

    .page-container {
      padding: 15px;
    }

    .slicers-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
      background: #ffffff;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .slicer-group {
      border: 1px solid var(--excel-border);
      border-radius: 4px;
      background: #fafafa;
      overflow: hidden;
    }

    .slicer-title {
      background-color: #e9eef4;
      padding: 6px 10px;
      font-weight: bold;
      font-size: 13px;
      border-bottom: 1px solid var(--excel-border);
      color: #1f4e79;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .slicer-icons {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 1px solid var(--excel-border);
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      color: #1f4e79;
    }
    .icon-btn:hover { background-color: #dde6f2; }
    .icon-btn.icon-active {
      background-color: var(--excel-btn-active);
      color: #fff;
      border-color: #1f4e79;
    }

    .slicer-buttons {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 4px;
      padding: 8px;
      max-height: 140px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .slicer-buttons::-webkit-scrollbar { width: 6px; }
    .slicer-buttons::-webkit-scrollbar-track { background: #f0f0f0; }
    .slicer-buttons::-webkit-scrollbar-thumb { background-color: var(--excel-border); border-radius: 4px; }

    .btn-slicer {
      background-color: var(--excel-btn-bg);
      border: 1px solid #8ea9db;
      color: #000;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
      border-radius: 2px;
      flex: 1 1 auto;
      min-width: 65px;
      text-align: center;
      transition: background-color 0.1s ease;
      touch-action: manipulation;
    }

    .btn-slicer:hover { background-color: #8ea9db; }
    .btn-slicer.active {
      background-color: var(--excel-btn-active);
      color: #ffffff;
      font-weight: bold;
    }

    .table-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
      color: #555;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toolbar-left { display: flex; flex-direction: column; gap: 2px; }
    .toolbar-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    #last-update { font-size: 11px; color: #777; }

    .btn-clear-filters, .btn-export-excel {
      background-color: #eef1f6;
      border: 1px solid var(--excel-border);
      color: #1f4e79;
      padding: 6px 12px;
      font-size: 11px;
      border-radius: 2px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-clear-filters:hover { background-color: #dde6f2; }

    .btn-export-excel {
      background-color: #217346;
      color: #fff;
      border-color: #17532f;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-export-excel:hover { background-color: #1a5c38; }
    .btn-export-excel:disabled { opacity: 0.6; cursor: not-allowed; }

    .table-container {
      overflow-x: auto;
      background: #fff;
      border: 1px solid #ccc;
      max-height: 70vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th {
      background-color: var(--excel-header-bg);
      color: white;
      padding: 8px;
      text-align: left;
      font-weight: 600;
      border: 1px solid #103356;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .filter-row th {
      background-color: #eef1f6;
      padding: 4px;
      position: sticky;
      top: 33px;
      z-index: 9;
    }

    .filter-dropdown { position: relative; }

    .btn-filter-toggle {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #fff;
      border: 1px solid var(--excel-border);
      color: #333;
      font-size: 11px;
      padding: 4px 6px;
      border-radius: 2px;
      cursor: pointer;
    }
    .btn-filter-toggle.filter-active {
      background-color: #dce8ff;
      border-color: var(--excel-btn-active);
      font-weight: bold;
      color: #1f4e79;
    }

    .filter-panel {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 100;
      width: 240px;
      background: #fff;
      border: 1px solid var(--excel-border);
      border-radius: 4px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
      padding: 8px;
      text-align: left;
      font-weight: normal;
    }

    .filter-sort-row { display: flex; gap: 4px; margin-bottom: 6px; }
    .filter-sort-row button {
      flex: 1;
      font-size: 11px;
      padding: 6px 2px;
      border: 1px solid var(--excel-border);
      background: #eef1f6;
      border-radius: 2px;
      cursor: pointer;
      color: #1f4e79;
    }

    .filter-search {
      width: 100%;
      padding: 6px;
      font-size: 12px;
      border: 1px solid var(--excel-border);
      border-radius: 2px;
      margin-bottom: 6px;
    }

    .filter-select-all {
      font-weight: bold;
      border-bottom: 1px solid #ddd;
      padding-bottom: 6px;
      margin-bottom: 4px;
    }

    .filter-check-list {
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 8px;
    }

    .filter-check-item {
      display: block;
      font-size: 12px;
      padding: 4px 2px;
      cursor: pointer;
      color: #333;
    }
    .filter-check-item input { margin-right: 6px; transform: scale(1.1); }

    .filter-actions { display: flex; gap: 6px; }
    .filter-actions button {
      flex: 1;
      font-size: 11px;
      padding: 8px;
      border-radius: 2px;
      cursor: pointer;
      border: 1px solid var(--excel-border);
    }
    .btn-apply { background: var(--excel-btn-active); color: #fff; }
    .btn-cancel { background: #eee; color: #333; }

    .load-more-container {
      text-align: center;
      padding: 10px;
      background: #fff;
      border: 1px solid #ccc;
      border-top: none;
    }

    .btn-load-more {
      background-color: var(--excel-btn-active);
      color: #fff;
      border: none;
      padding: 8px 16px;
      font-size: 12px;
      border-radius: 3px;
      cursor: pointer;
    }

    td {
      padding: 6px 8px;
      border: 1px solid #e0e0e0;
      white-space: nowrap;
    }

    tr:nth-child(even) { background-color: #f9fbfd; }
    tr:hover { background-color: #edf2f8; }

    /* Ajustes específicos para Móviles */
    @media (max-width: 600px) {
      .page-container { padding: 8px; }
      .slicers-container { grid-template-columns: 1fr; gap: 8px; padding: 8px; }
      .slicer-buttons { max-height: 110px; }
      .table-toolbar { flex-direction: column; align-items: flex-start; }
      .toolbar-right { width: 100%; justify-content: space-between; }
      .filter-panel { position: fixed; left: 5%; right: 5%; top: 20%; width: 90%; }
    }
  </style>
</head>
<body>

  <div class="top-bar">Realizado por: Juan Albarracin.</div>

  <div class="page-container">
    <h2>Dashboard de Ranking y Resultados</h2>

    <!-- Segmentadores (Slicers) -->
    <div class="slicers-container">
      <div class="slicer-group">
        <div class="slicer-title">
          <span>Género</span>
          <span class="slicer-icons">
            <button type="button" class="icon-btn" id="multi-Genero" title="Selección múltiple" onclick="toggleMultiSelectMode('Genero', this)">🗹</button>
            <button type="button" class="icon-btn" title="Quitar filtro" onclick="clearSlicer('Genero')">🚫</button>
          </span>
        </div>
        <div class="slicer-buttons" id="slicer-genero"></div>
      </div>
      <div class="slicer-group">
        <div class="slicer-title">
          <span>Categoría</span>
          <span class="slicer-icons">
            <button type="button" class="icon-btn" id="multi-Categoría" title="Selección múltiple" onclick="toggleMultiSelectMode('Categoría', this)">🗹</button>
            <button type="button" class="icon-btn" title="Quitar filtro" onclick="clearSlicer('Categoría')">🚫</button>
          </span>
        </div>
        <div class="slicer-buttons" id="slicer-categoria"></div>
      </div>
      <div class="slicer-group">
        <div class="slicer-title">
          <span>Liga</span>
          <span class="slicer-icons">
            <button type="button" class="icon-btn" id="multi-LIGA" title="Selección múltiple" onclick="toggleMultiSelectMode('LIGA', this)">🗹</button>
            <button type="button" class="icon-btn" title="Quitar filtro" onclick="clearSlicer('LIGA')">🚫</button>
          </span>
        </div>
        <div class="slicer-buttons" id="slicer-liga"></div>
      </div>
      <div class="slicer-group">
        <div class="slicer-title">
          <span>Prueba</span>
          <span class="slicer-icons">
            <button type="button" class="icon-btn" id="multi-PRUEBA" title="Selección múltiple" onclick="toggleMultiSelectMode('PRUEBA', this)">🗹</button>
            <button type="button" class="icon-btn" title="Quitar filtro" onclick="clearSlicer('PRUEBA')">🚫</button>
          </span>
        </div>
        <div class="slicer-buttons" id="slicer-prueba"></div>
      </div>
    </div>

    <div class="table-toolbar">
      <div class="toolbar-left">
        <span id="row-counter"></span>
        <span id="last-update"></span>
      </div>
      <div class="toolbar-right">
        <span id="sort-indicator"></span>
        <button class="btn-export-excel" id="btn-export" onclick="exportToExcel()">⬇ Descargar Excel</button>
        <button class="btn-clear-filters" onclick="clearAll()">Limpiar filtros de columna</button>
      </div>
    </div>

    <!-- Tabla de Datos -->
    <div class="table-container">
      <table id="ranking-table">
        <thead>
          <tr id="table-headers"></tr>
          <tr id="filter-row" class="filter-row"></tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="12">Cargando datos...</td></tr>
        </tbody>
      </table>
    </div>
    <div id="load-more-box" class="load-more-container" style="display: none;">
      <button class="btn-load-more" onclick="renderMoreRows()">Cargar más filas...</button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzo0LhRkLz2nU3ydkGWEy-I6B0hYOvpVfUivhjqIZVdrQ_XBLA3X4QFC-hMs021fW0/exec";
    const CACHE_KEY = 'ranking_natacion_cache_v1';
    const CACHE_TTL_MS = 12 * 60 * 60 * 1000;
    
    // Control de límite de filas para acelerar renderizado móvil
    const PAGE_SIZE = 100;
    let currentRenderLimit = PAGE_SIZE;

    const COLUMNS = [
      { key: 'POSC.',            label: 'POSC.' },
      { key: 'PRUEBA',           label: 'PRUEBA' },
      { key: 'NADADOR',          label: 'NADADOR', bold: true },
      { key: 'Nac. (Año-mes)',   label: 'Nac. (Año-mes)' },
      { key: 'Tiempo',           label: 'Tiempo' },
      { key: 'P. WA',            label: 'P. WA' },
      { key: 'Fecha Torneo',     label: 'Fecha Torneo' },
      { key: 'LIGA',             label: 'LIGA' },
      { key: 'CLUB',             label: 'CLUB' },
      { key: 'Genero',           label: 'Genero' },
      { key: 'Categoría',        label: 'Categoría' },
      { key: 'Edad',             label: 'Edad' }
    ];

    let allData = [];
    let selectedFilters = { Genero: null, Categoría: null, LIGA: null, PRUEBA: null };
    let multiSelectMode = { Genero: false, Categoría: false, LIGA: false, PRUEBA: false };

    const SLICER_FIELD_TO_ELEMENT = {
      Genero: 'slicer-genero',
      'Categoría': 'slicer-categoria',
      LIGA: 'slicer-liga',
      PRUEBA: 'slicer-prueba'
    };

    let columnFilters = {};
    COLUMNS.forEach(c => columnFilters[c.key] = null);
    let sortState = { key: null, direction: null };

    function getVal(row, col) { return row[col.key] ?? ''; }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function ordenarValoresPrueba(valores) {
      return valores.slice().sort((a, b) => {
        const da = parseInt((String(a).match(/^\d+/) || ['0'])[0], 10);
        const db = parseInt((String(b).match(/^\d+/) || ['0'])[0], 10);
        if (da !== db) return da - db;
        return String(a).localeCompare(String(b), 'es');
      });
    }

    function ordenarValores(key, valores) {
      if (key === 'PRUEBA') return ordenarValoresPrueba(valores);
      return valores.slice().sort((a, b) => String(a).localeCompare(String(b), 'es', { numeric: true }));
    }

    function readCache() {
      try {
        const raw = sessionStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) { return null; }
    }

    function writeCache(data) {
      const ts = Date.now();
      try {
        sessionStorage.setItem(CACHE_KEY, JSON.stringify({ data, ts }));
      } catch (e) {}
      renderLastUpdate(ts);
    }

    function renderLastUpdate(ts) {
      const el = document.getElementById('last-update');
      if (!el) return;
      const fecha = new Date(ts);
      el.innerText = 'Datos cargados: ' + fecha.toLocaleString('es-CO', {
        day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    }

    async function loadData() {
      const cached = readCache();
      if (cached) {
        allData = cached.data;
        buildTableHeaders();
        buildSlicers();
        buildColumnFilters();
        applyFilters();
        renderLastUpdate(cached.ts);

        if ((Date.now() - cached.ts) >= CACHE_TTL_MS) {
          refreshInBackground(false);
        }
        return;
      }

      document.getElementById('table-body').innerHTML = `<tr><td colspan="${COLUMNS.length}">Cargando datos...</td></tr>`;
      await refreshInBackground(true);
    }

    async function refreshInBackground(isFirstLoad) {
      try {
        const res = await fetch(API_URL);
        const freshData = await res.json();
        allData = freshData;
        writeCache(freshData);
        buildTableHeaders();
        buildSlicers();
        buildColumnFilters();
        applyFilters();
      } catch (err) {
        if (isFirstLoad) {
          document.getElementById('table-body').innerHTML = `<tr><td colspan="${COLUMNS.length}">Error al cargar datos.</td></tr>`;
        }
      }
    }

    function buildTableHeaders() {
      document.getElementById('table-headers').innerHTML = COLUMNS.map(c => `<th>${c.label}</th>`).join('');
    }

    function buildSlicers() {
      Object.keys(SLICER_FIELD_TO_ELEMENT).forEach(field => createSlicerButtons(field, SLICER_FIELD_TO_ELEMENT[field]));
    }

    function createSlicerButtons(field, elementId) {
      const container = document.getElementById(elementId);
      let uniqueValues = [...new Set(allData.map(item => item[field]).filter(Boolean))];
      uniqueValues = ordenarValores(field, uniqueValues);

      const current = selectedFilters[field];
      const frag = document.createDocumentFragment();
      const btnTodos = document.createElement('button');
      btnTodos.className = 'btn-slicer' + (current === null ? ' active' : '');
      btnTodos.innerText = 'Todos';
      btnTodos.onclick = () => clearSlicer(field);
      frag.appendChild(btnTodos);

      uniqueValues.forEach(val => {
        const isActive = current !== null && current.has(val);
        const btn = document.createElement('button');
        btn.className = 'btn-slicer' + (isActive ? ' active' : '');
        btn.innerText = val;
        btn.title = val;
        btn.onclick = () => toggleSlicerValue(field, val);
        frag.appendChild(btn);
      });

      container.innerHTML = '';
      container.appendChild(frag);
    }

    function toggleSlicerValue(field, value) {
      const isMulti = multiSelectMode[field];
      const current = selectedFilters[field];

      if (!isMulti) {
        if (current instanceof Set && current.size === 1 && current.has(value)) {
          selectedFilters[field] = null;
        } else {
          selectedFilters[field] = new Set([value]);
        }
      } else {
        const newSet = current ? new Set(current) : new Set();
        if (newSet.has(value)) newSet.delete(value);
        else newSet.add(value);
        selectedFilters[field] = newSet.size > 0 ? newSet : null;
      }

      createSlicerButtons(field, SLICER_FIELD_TO_ELEMENT[field]);
      applyFilters();
    }

    function clearSlicer(field) {
      selectedFilters[field] = null;
      createSlicerButtons(field, SLICER_FIELD_TO_ELEMENT[field]);
      applyFilters();
    }

    function toggleMultiSelectMode(field, iconEl) {
      multiSelectMode[field] = !multiSelectMode[field];
      iconEl.classList.toggle('icon-active', multiSelectMode[field]);
    }

    function buildColumnFilters() {
      const filterRow = document.getElementById('filter-row');
      filterRow.innerHTML = COLUMNS.map((col, idx) => `
        <th>
          <div class="filter-dropdown">
            <button type="button" class="btn-filter-toggle${columnFilters[col.key] ? ' filter-active' : ''}" id="toggle-${idx}" onclick="toggleFilterPanel(${idx})">
              <span>Filtrar</span><span>▾</span>
            </button>
            <div class="filter-panel" id="panel-${idx}"></div>
          </div>
        </th>
      `).join('');
    }

    function toggleFilterPanel(idx) {
      const panel = document.getElementById('panel-' + idx);
      const isOpen = panel.style.display === 'block';
      document.querySelectorAll('.filter-panel').forEach(p => p.style.display = 'none');
      if (isOpen) return;
      renderFilterPanel(idx);
      panel.style.display = 'block';
    }

    function renderFilterPanel(idx) {
      const col = COLUMNS[idx];
      const panel = document.getElementById('panel-' + idx);
      const allValues = ordenarValores(col.key, [...new Set(allData.map(row => String(getVal(row, col))).filter(v => v !== ''))]);
      const current = columnFilters[col.key];

      panel.innerHTML = `
        <div class="filter-sort-row">
          <button type="button" onclick="sortByColumn(${idx}, 'asc')">▲ A-Z</button>
          <button type="button" onclick="sortByColumn(${idx}, 'desc')">▼ Z-A</button>
        </div>
        <input type="text" class="filter-search" placeholder="Buscar..." oninput="filterPanelSearch(${idx}, this.value)">
        <label class="filter-check-item filter-select-all">
          <input type="checkbox" id="checkall-${idx}" ${!current ? 'checked' : ''} onchange="toggleSelectAll(${idx}, this.checked)">
          (Seleccionar todo)
        </label>
        <div class="filter-check-list" id="checklist-${idx}">
          ${allValues.map(v => `
            <label class="filter-check-item">
              <input type="checkbox" value="${escapeHtml(v)}" ${(!current || current.has(v)) ? 'checked' : ''}>
              ${escapeHtml(v)}
            </label>
          `).join('')}
        </div>
        <div class="filter-actions">
          <button type="button" class="btn-apply" onclick="applyColumnFilter(${idx})">Aceptar</button>
          <button type="button" class="btn-cancel" onclick="closePanel(${idx})">Cancelar</button>
        </div>
      `;
    }

    function filterPanelSearch(idx, text) {
      const t = text.toLowerCase();
      document.querySelectorAll('#checklist-' + idx + ' .filter-check-item').forEach(item => {
        const label = item.textContent.trim().toLowerCase();
        item.style.display = label.includes(t) ? 'block' : 'none';
      });
    }

    function toggleSelectAll(idx, checked) {
      document.querySelectorAll('#checklist-' + idx + ' input[type=checkbox]').forEach(cb => cb.checked = checked);
    }

    function applyColumnFilter(idx) {
      const col = COLUMNS[idx];
      const checkboxes = [...document.querySelectorAll('#checklist-' + idx + ' input[type=checkbox]')];
      const checked = checkboxes.filter(cb => cb.checked).map(cb => cb.value);

      if (checked.length === checkboxes.length) {
        columnFilters[col.key] = null;
      } else {
        columnFilters[col.key] = new Set(checked);
      }

      document.getElementById('toggle-' + idx).classList.toggle('filter-active', columnFilters[col.key] !== null);
      closePanel(idx);
      applyFilters();
    }

    function closePanel(idx) {
      document.getElementById('panel-' + idx).style.display = 'none';
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.filter-dropdown')) {
        document.querySelectorAll('.filter-panel').forEach(p => p.style.display = 'none');
      }
    });

    function sortByColumn(idx, direction) {
      sortState = { key: COLUMNS[idx].key, direction };
      closePanel(idx);
      applyFilters();
    }

    function clearSort() {
      sortState = { key: null, direction: null };
      applyFilters();
    }

    function clearAll() {
      COLUMNS.forEach(c => columnFilters[c.key] = null);
      sortState = { key: null, direction: null };
      buildColumnFilters();
      applyFilters();
    }

    let currentFiltered = [];

    function passesSlicer(field, rowValue) {
      const sel = selectedFilters[field];
      if (!sel) return true;
      return sel.has(rowValue);
    }

    function applyFilters() {
      currentRenderLimit = PAGE_SIZE; // Resetear límite al filtrar

      let filtered = allData.filter(row => {
        if (!passesSlicer('Genero', row.Genero) ||
            !passesSlicer('Categoría', row.Categoría) ||
            !passesSlicer('LIGA', row.LIGA) ||
            !passesSlicer('PRUEBA', row.PRUEBA)) {
          return false;
        }

        for (let i = 0; i < COLUMNS.length; i++) {
          const colKey = COLUMNS[i].key;
          const filterSet = columnFilters[colKey];
          if (filterSet && !filterSet.has(String(getVal(row, COLUMNS[i])))) {
            return false;
          }
        }
        return true;
      });

      if (sortState.key) {
        const col = COLUMNS.find(c => c.key === sortState.key);
        filtered.sort((a, b) => {
          const cmp = String(getVal(a, col)).localeCompare(String(getVal(b, col)), 'es', { numeric: true });
          return sortState.direction === 'desc' ? -cmp : cmp;
        });
      }

      const indicator = document.getElementById('sort-indicator');
      indicator.innerHTML = sortState.key
        ? `Ordenado por ${sortState.key} ${sortState.direction === 'desc' ? '▼' : '▲'} <a href="#" onclick="clearSort();return false;">(quitar)</a>`
        : '';

      currentFiltered = filtered;
      renderTable(filtered);
    }

    function renderTable(data) {
      const tbody = document.getElementById('table-body');
      const loadMoreBox = document.getElementById('load-more-box');
      document.getElementById('row-counter').innerText = `${data.length} resultado${data.length === 1 ? '' : 's'}`;

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${COLUMNS.length}">No se encontraron resultados.</td></tr>`;
        loadMoreBox.style.display = 'none';
        return;
      }

      // Renderizado recortado a 'currentRenderLimit' para evitar latencia táctil
      const slice = data.slice(0, currentRenderLimit);
      const frag = document.createDocumentFragment();

      slice.forEach(row => {
        const tr = document.createElement('tr');
        COLUMNS.forEach(col => {
          const td = document.createElement('td');
          const val = getVal(row, col);
          if (col.bold) {
            const b = document.createElement('b');
            b.textContent = val;
            td.appendChild(b);
          } else {
            td.textContent = val;
          }
          tr.appendChild(td);
        });
        frag.appendChild(tr);
      });

      tbody.innerHTML = '';
      tbody.appendChild(frag);

      if (data.length > currentRenderLimit) {
        loadMoreBox.style.display = 'block';
      } else {
        loadMoreBox.style.display = 'none';
      }
    }

    function renderMoreRows() {
      currentRenderLimit += PAGE_SIZE;
      renderTable(currentFiltered);
    }

    function exportToExcel() {
      if (!currentFiltered.length) {
        alert('No hay datos para exportar con los filtros actuales.');
        return;
      }

      const btn = document.getElementById('btn-export');
      btn.disabled = true;
      const originalText = btn.innerText;
      btn.innerText = 'Generando...';

      setTimeout(() => {
        try {
          const rows = currentFiltered.map(row => {
            const obj = {};
            COLUMNS.forEach(col => { obj[col.label] = getVal(row, col); });
            return obj;
          });

          const ws = XLSX.utils.json_to_sheet(rows);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Ranking');

          const fecha = new Date().toISOString().slice(0, 10);
          XLSX.writeFile(wb, `ranking_natacion_${fecha}.xlsx`);
        } finally {
          btn.disabled = false;
          btn.innerText = originalText;
        }
      }, 50);
    }

    loadData();
  </script>
</body>
</html>
