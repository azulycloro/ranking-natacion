<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking Natación - Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --excel-header-bg: #1f4e79;
      --excel-btn-bg: #b4c6e7;
      --excel-btn-active: #2f5597;
      --excel-border: #8ea9db;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      color: #333;
    }

    /* Barra superior gris (igual estilo a la referencia) */
    .top-bar {
      background-color: #e5e5e5;
      color: #666;
      text-align: center;
      padding: 6px 0;
      font-size: 13px;
      width: 100%;
    }

    .page-container {
      padding: 20px;
    }

    .slicers-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
      background: #ffffff;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .slicer-group {
      border: 1px solid var(--excel-border);
      border-radius: 4px;
      background: #fafafa;
      overflow: hidden;
    }

    .slicer-title {
      background-color: #e9eef4;
      padding: 6px 10px;
      font-weight: bold;
      font-size: 13px;
      border-bottom: 1px solid var(--excel-border);
      color: #1f4e79;
    }

    .slicer-buttons {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 4px;
      padding: 8px;
      height: 120px; /* 2/3 de 180px */
      overflow-y: scroll;
    }

    .slicer-buttons::-webkit-scrollbar { width: 8px; }
    .slicer-buttons::-webkit-scrollbar-track { background: #f0f0f0; }
    .slicer-buttons::-webkit-scrollbar-thumb { background-color: var(--excel-border); border-radius: 4px; }

    .btn-slicer {
      background-color: var(--excel-btn-bg);
      border: 1px solid #8ea9db;
      color: #000;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
      border-radius: 2px;
      flex: 1 1 auto;
      min-width: 70px;
      height: fit-content;
      text-align: center;
      transition: all 0.1s ease;
    }

    .btn-slicer:hover { background-color: #8ea9db; }

    .btn-slicer.active {
      background-color: var(--excel-btn-active);
      color: #ffffff;
      font-weight: bold;
    }

    .table-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 12px;
      color: #555;
    }

    .toolbar-right { display: flex; gap: 8px; align-items: center; }

    .btn-clear-filters, .btn-export-excel {
      background-color: #eef1f6;
      border: 1px solid var(--excel-border);
      color: #1f4e79;
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 2px;
      cursor: pointer;
    }
    .btn-clear-filters:hover, .btn-export-excel:hover { background-color: #dde6f2; }

    .btn-export-excel {
      background-color: #217346; /* verde estilo Excel */
      color: #fff;
      border-color: #17532f;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-export-excel:hover { background-color: #1a5c38; }
    .btn-export-excel:disabled { opacity: 0.6; cursor: not-allowed; }

    .table-container {
      overflow-x: auto;
      background: #fff;
      border: 1px solid #ccc;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th {
      background-color: var(--excel-header-bg);
      color: white;
      padding: 8px;
      text-align: left;
      font-weight: 600;
      border: 1px solid #103356;
      white-space: nowrap;
    }

    .filter-row th {
      background-color: #eef1f6;
      padding: 4px;
      position: relative;
    }

    /* Dropdown de filtro tipo Excel */
    .filter-dropdown { position: relative; }

    .btn-filter-toggle {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #fff;
      border: 1px solid var(--excel-border);
      color: #333;
      font-size: 11px;
      padding: 4px 6px;
      border-radius: 2px;
      cursor: pointer;
      box-sizing: border-box;
    }
    .btn-filter-toggle:hover { background-color: #f4f7fb; }
    .btn-filter-toggle.filter-active {
      background-color: #dce8ff;
      border-color: var(--excel-btn-active);
      font-weight: bold;
      color: #1f4e79;
    }

    .filter-panel {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 100;
      width: 230px;
      background: #fff;
      border: 1px solid var(--excel-border);
      border-radius: 4px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.18);
      padding: 8px;
      text-align: left;
      white-space: normal;
      font-weight: normal;
    }

    .filter-sort-row { display: flex; gap: 4px; margin-bottom: 6px; }
    .filter-sort-row button {
      flex: 1;
      font-size: 10px;
      padding: 5px 2px;
      border: 1px solid var(--excel-border);
      background: #eef1f6;
      border-radius: 2px;
      cursor: pointer;
      color: #1f4e79;
    }
    .filter-sort-row button:hover { background: #dde6f2; }

    .filter-search {
      width: 100%;
      box-sizing: border-box;
      padding: 5px 6px;
      font-size: 11px;
      border: 1px solid var(--excel-border);
      border-radius: 2px;
      margin-bottom: 6px;
    }

    .filter-select-all {
      font-weight: bold;
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;
      margin-bottom: 4px;
    }

    .filter-check-list {
      max-height: 160px;
      overflow-y: auto;
      margin-bottom: 8px;
    }

    .filter-check-item {
      display: block;
      font-size: 11px;
      padding: 3px 2px;
      cursor: pointer;
      color: #333;
    }
    .filter-check-item input { margin-right: 6px; }

    .filter-actions { display: flex; gap: 6px; }
    .filter-actions button {
      flex: 1;
      font-size: 11px;
      padding: 6px;
      border-radius: 2px;
      cursor: pointer;
      border: 1px solid var(--excel-border);
    }
    .btn-apply { background: var(--excel-btn-active); color: #fff; }
    .btn-apply:hover { opacity: 0.9; }
    .btn-cancel { background: #eee; color: #333; }
    .btn-cancel:hover { background: #e2e2e2; }

    td {
      padding: 6px 8px;
      border: 1px solid #e0e0e0;
    }

    tr:nth-child(even) { background-color: #f9fbfd; }
    tr:hover { background-color: #edf2f8; }

    .stale-badge {
      font-size: 10px;
      color: #b06a00;
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <div class="top-bar">Realizado por: Juan Albarracin.</div>

  <div class="page-container">
    <h2>Dashboard de Ranking y Resultados</h2>

    <!-- Segmentadores (Slicers) -->
    <div class="slicers-container">
      <div class="slicer-group">
        <div class="slicer-title">Género</div>
        <div class="slicer-buttons" id="slicer-genero"></div>
      </div>
      <div class="slicer-group">
        <div class="slicer-title">Categoría</div>
        <div class="slicer-buttons" id="slicer-categoria"></div>
      </div>
      <div class="slicer-group">
        <div class="slicer-title">Liga</div>
        <div class="slicer-buttons" id="slicer-liga"></div>
      </div>
      <div class="slicer-group">
        <div class="slicer-title">Prueba</div>
        <div class="slicer-buttons" id="slicer-prueba"></div>
      </div>
    </div>

    <div class="table-toolbar">
      <span id="row-counter"></span>
      <div class="toolbar-right">
        <span id="sort-indicator"></span>
        <button class="btn-export-excel" id="btn-export" onclick="exportToExcel()">⬇ Descargar Excel</button>
        <button class="btn-clear-filters" onclick="clearAll()">Limpiar filtros de columna</button>
      </div>
    </div>

    <!-- Tabla de Datos -->
    <div class="table-container">
      <table id="ranking-table">
        <thead>
          <tr id="table-headers"></tr>
          <tr id="filter-row" class="filter-row"></tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="12">Cargando datos...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzo0LhRkLz2nU3ydkGWEy-I6B0hYOvpVfUivhjqIZVdrQ_XBLA3X4QFC-hMs021fW0/exec";

    // ---- Caché local (stale-while-revalidate) ----
    // Muestra datos guardados instantáneamente mientras trae datos frescos en segundo plano.
    const CACHE_KEY = 'ranking_natacion_cache_v1';
    const CACHE_TTL_MS = 5 * 60 * 1000; // 5 minutos: tras este tiempo se refresca igual, aunque se muestre lo cacheado primero

    // Deben coincidir con las llaves de CANONICAL_COLUMNS en el Apps Script.
    const COLUMNS = [
      { key: 'POSC.',              label: 'POSC.' },
      { key: 'PRUEBA',              label: 'PRUEBA' },
      { key: 'NADADOR',             label: 'NADADOR', bold: true },
      { key: 'Nac. (Año-mes)',      label: 'Nac. (Año-mes)' },
      { key: 'Tiempo',              label: 'Tiempo' },
      { key: 'P. WA',               label: 'P. WA' },
      { key: 'Fecha Torneo',        label: 'Fecha Torneo' },
      { key: 'LIGA',                label: 'LIGA' },
      { key: 'CLUB',                label: 'CLUB' },
      { key: 'Genero',              label: 'Genero' },
      { key: 'Categoría',           label: 'Categoría' },
      { key: 'Edad',                label: 'Edad' }
    ];

    let allData = [];

    // Filtros de los slicers de arriba (valor único seleccionado, o null = todos)
    let selectedFilters = { Genero: null, Categoría: null, LIGA: null, PRUEBA: null };

    // Filtros de columna (estilo Excel): Set de valores permitidos, o null = todos permitidos
    let columnFilters = {};
    COLUMNS.forEach(c => columnFilters[c.key] = null);

    // Ordenamiento activo de la tabla (una sola columna a la vez, como en Excel)
    let sortState = { key: null, direction: null };

    function getVal(row, col) {
      return row[col.key] ?? '';
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    // Ordena "50m Libre/50m Free", "200m Espalda/200m Back", etc. por distancia numérica ascendente
    function ordenarValoresPrueba(valores) {
      return valores.slice().sort((a, b) => {
        const da = parseInt((String(a).match(/^\d+/) || ['0'])[0], 10);
        const db = parseInt((String(b).match(/^\d+/) || ['0'])[0], 10);
        if (da !== db) return da - db;
        return String(a).localeCompare(String(b), 'es');
      });
    }

    function ordenarValores(key, valores) {
      if (key === 'PRUEBA') return ordenarValoresPrueba(valores);
      return valores.slice().sort((a, b) => String(a).localeCompare(String(b), 'es', { numeric: true }));
    }

    // ---- Carga de datos con caché stale-while-revalidate ----
    function readCache() {
      try {
        const raw = sessionStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) {
        return null;
      }
    }

    function writeCache(data) {
      try {
        sessionStorage.setItem(CACHE_KEY, JSON.stringify({ data, ts: Date.now() }));
      } catch (e) { /* si sessionStorage falla, seguimos sin caché */ }
    }

    async function loadData() {
      const cached = readCache();

      if (cached) {
        // Pintamos de inmediato con lo que ya teníamos guardado (sensación instantánea)
        allData = cached.data;
        buildTableHeaders();
        buildSlicers();
        buildColumnFilters();
        applyFilters();

        const isFresh = (Date.now() - cached.ts) < CACHE_TTL_MS;
        if (isFresh) {
          // Aún vigente: no hace falta ir a buscar datos nuevos ahora mismo,
          // pero igual refrescamos en segundo plano sin bloquear la UI.
          refreshInBackground();
          return;
        }
      } else {
        document.getElementById('table-body').innerHTML =
          `<tr><td colspan="${COLUMNS.length}">Cargando datos...</td></tr>`;
      }

      await refreshInBackground(!cached);
    }

    async function refreshInBackground(isFirstLoad) {
      try {
        const res = await fetch(API_URL);
        const freshData = await res.json();
        allData = freshData;
        writeCache(freshData);
        buildTableHeaders();
        buildSlicers();
        buildColumnFilters();
        applyFilters();
      } catch (err) {
        if (isFirstLoad) {
          document.getElementById('table-body').innerHTML =
            `<tr><td colspan="${COLUMNS.length}">Error al cargar datos.</td></tr>`;
        }
        // Si ya había datos en caché mostrados, los dejamos así aunque falle el refresco.
      }
    }

    function buildTableHeaders() {
      document.getElementById('table-headers').innerHTML = COLUMNS.map(c => `<th>${c.label}</th>`).join('');
    }

    // -------------------- Slicers superiores --------------------
    function buildSlicers() {
      createSlicerButtons('Genero', 'slicer-genero');
      createSlicerButtons('Categoría', 'slicer-categoria');
      createSlicerButtons('LIGA', 'slicer-liga');
      createSlicerButtons('PRUEBA', 'slicer-prueba');
    }

    function createSlicerButtons(field, elementId) {
      const container = document.getElementById(elementId);
      let uniqueValues = [...new Set(allData.map(item => item[field]).filter(Boolean))];
      uniqueValues = ordenarValores(field, uniqueValues);

      // Conserva la selección activa si ya existía (por ejemplo, tras un refresco en segundo plano)
      const currentSelection = selectedFilters[field];

      const frag = document.createDocumentFragment();
      const btnTodos = document.createElement('button');
      btnTodos.className = 'btn-slicer' + (currentSelection === null ? ' active' : '');
      btnTodos.innerText = 'Todos';
      btnTodos.onclick = () => setFilter(field, null, btnTodos);
      frag.appendChild(btnTodos);

      uniqueValues.forEach(val => {
        const btn = document.createElement('button');
        btn.className = 'btn-slicer' + (currentSelection === val ? ' active' : '');
        btn.innerText = val;
        btn.onclick = () => setFilter(field, val, btn);
        frag.appendChild(btn);
      });

      container.innerHTML = '';
      container.appendChild(frag);
    }

    function setFilter(field, value, btnElement) {
      selectedFilters[field] = value;
      const parent = btnElement.parentElement;
      parent.querySelectorAll('.btn-slicer').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      applyFilters();
    }

    // -------------------- Filtros de columna (estilo Excel) --------------------
    function buildColumnFilters() {
      const filterRow = document.getElementById('filter-row');
      filterRow.innerHTML = COLUMNS.map((col, idx) => `
        <th>
          <div class="filter-dropdown">
            <button type="button" class="btn-filter-toggle${columnFilters[col.key] ? ' filter-active' : ''}" id="toggle-${idx}" onclick="toggleFilterPanel(${idx})">
              <span>Filtrar</span><span>▾</span>
            </button>
            <div class="filter-panel" id="panel-${idx}"></div>
          </div>
        </th>
      `).join('');
    }

    function toggleFilterPanel(idx) {
      const panel = document.getElementById('panel-' + idx);
      const isOpen = panel.style.display === 'block';
      document.querySelectorAll('.filter-panel').forEach(p => p.style.display = 'none');
      if (isOpen) return;
      renderFilterPanel(idx);
      panel.style.display = 'block';
    }

    function renderFilterPanel(idx) {
      const col = COLUMNS[idx];
      const panel = document.getElementById('panel-' + idx);
      const allValues = ordenarValores(col.key, [...new Set(allData.map(row => String(getVal(row, col))).filter(v => v !== ''))]);
      const current = columnFilters[col.key]; // Set o null (null = todos marcados)

      panel.innerHTML = `
        <div class="filter-sort-row">
          <button type="button" onclick="sortByColumn(${idx}, 'asc')">▲ A-Z</button>
          <button type="button" onclick="sortByColumn(${idx}, 'desc')">▼ Z-A</button>
        </div>
        <input type="text" class="filter-search" placeholder="Buscar..." oninput="filterPanelSearch(${idx}, this.value)">
        <label class="filter-check-item filter-select-all">
          <input type="checkbox" id="checkall-${idx}" ${!current ? 'checked' : ''} onchange="toggleSelectAll(${idx}, this.checked)">
          (Seleccionar todo)
        </label>
        <div class="filter-check-list" id="checklist-${idx}">
          ${allValues.map(v => `
            <label class="filter-check-item">
              <input type="checkbox" value="${escapeHtml(v)}" ${(!current || current.has(v)) ? 'checked' : ''}>
              ${escapeHtml(v)}
            </label>
          `).join('')}
        </div>
        <div class="filter-actions">
          <button type="button" class="btn-apply" onclick="applyColumnFilter(${idx})">Aceptar</button>
          <button type="button" class="btn-cancel" onclick="closePanel(${idx})">Cancelar</button>
        </div>
      `;
    }

    function filterPanelSearch(idx, text) {
      const t = text.toLowerCase();
      document.querySelectorAll('#checklist-' + idx + ' .filter-check-item').forEach(item => {
        const label = item.textContent.trim().toLowerCase();
        item.style.display = label.includes(t) ? 'block' : 'none';
      });
    }

    function toggleSelectAll(idx, checked) {
      document.querySelectorAll('#checklist-' + idx + ' input[type=checkbox]').forEach(cb => cb.checked = checked);
    }

    function applyColumnFilter(idx) {
      const col = COLUMNS[idx];
      const checkboxes = [...document.querySelectorAll('#checklist-' + idx + ' input[type=checkbox]')];
      const checked = checkboxes.filter(cb => cb.checked).map(cb => cb.value);

      if (checked.length === checkboxes.length) {
        columnFilters[col.key] = null; // todo seleccionado = sin filtro
      } else {
        columnFilters[col.key] = new Set(checked);
      }

      document.getElementById('toggle-' + idx).classList.toggle('filter-active', columnFilters[col.key] !== null);
      closePanel(idx);
      applyFilters();
    }

    function closePanel(idx) {
      document.getElementById('panel-' + idx).style.display = 'none';
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.filter-dropdown')) {
        document.querySelectorAll('.filter-panel').forEach(p => p.style.display = 'none');
      }
    });

    // -------------------- Ordenamiento de la tabla --------------------
    function sortByColumn(idx, direction) {
      sortState = { key: COLUMNS[idx].key, direction };
      closePanel(idx);
      applyFilters();
    }

    function clearSort() {
      sortState = { key: null, direction: null };
      applyFilters();
    }

    // -------------------- Limpiar todo --------------------
    function clearAll() {
      COLUMNS.forEach(c => columnFilters[c.key] = null);
      sortState = { key: null, direction: null };
      buildColumnFilters();
      applyFilters();
    }

    // -------------------- Filtrado + render --------------------
    let currentFiltered = []; // usado también por el botón de exportar a Excel

    function applyFilters() {
      let filtered = allData.filter(row => {
        const passSlicers =
          (!selectedFilters.Genero || row.Genero === selectedFilters.Genero) &&
          (!selectedFilters.Categoría || row.Categoría === selectedFilters.Categoría) &&
          (!selectedFilters.LIGA || row.LIGA === selectedFilters.LIGA) &&
          (!selectedFilters.PRUEBA || row.PRUEBA === selectedFilters.PRUEBA);

        if (!passSlicers) return false;

        return COLUMNS.every(col => {
          const filterSet = columnFilters[col.key];
          if (!filterSet) return true;
          return filterSet.has(String(getVal(row, col)));
        });
      });

      if (sortState.key) {
        const col = COLUMNS.find(c => c.key === sortState.key);
        filtered = filtered.slice().sort((a, b) => {
          const cmp = String(getVal(a, col)).localeCompare(String(getVal(b, col)), 'es', { numeric: true });
          return sortState.direction === 'desc' ? -cmp : cmp;
        });
      }

      const indicator = document.getElementById('sort-indicator');
      indicator.innerHTML = sortState.key
        ? `Ordenado por ${sortState.key} ${sortState.direction === 'desc' ? '▼' : '▲'} <a href="#" onclick="clearSort();return false;">(quitar)</a>`
        : '';

      currentFiltered = filtered;
      renderTable(filtered);
    }

    function renderTable(data) {
      const tbody = document.getElementById('table-body');
      document.getElementById('row-counter').innerText = `${data.length} resultado${data.length === 1 ? '' : 's'}`;

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${COLUMNS.length}">No se encontraron resultados.</td></tr>`;
        return;
      }

      // Construcción vía DocumentFragment: más rápido que reconstruir todo el innerHTML en tablas grandes
      const frag = document.createDocumentFragment();
      data.forEach(row => {
        const tr = document.createElement('tr');
        COLUMNS.forEach(col => {
          const td = document.createElement('td');
          const val = getVal(row, col);
          if (col.bold) {
            const b = document.createElement('b');
            b.textContent = val;
            td.appendChild(b);
          } else {
            td.textContent = val;
          }
          tr.appendChild(td);
        });
        frag.appendChild(tr);
      });

      tbody.innerHTML = '';
      tbody.appendChild(frag);
    }

    // -------------------- Exportar a Excel --------------------
    function exportToExcel() {
      if (!currentFiltered.length) {
        alert('No hay datos para exportar con los filtros actuales.');
        return;
      }

      const btn = document.getElementById('btn-export');
      btn.disabled = true;
      const originalText = btn.innerText;
      btn.innerText = 'Generando...';

      try {
        // Exporta exactamente lo que se ve en pantalla (con filtros y orden aplicados)
        const rows = currentFiltered.map(row => {
          const obj = {};
          COLUMNS.forEach(col => { obj[col.label] = getVal(row, col); });
          return obj;
        });

        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Ranking');

        const fecha = new Date().toISOString().slice(0, 10);
        XLSX.writeFile(wb, `ranking_natacion_${fecha}.xlsx`);
      } finally {
        btn.disabled = false;
        btn.innerText = originalText;
      }
    }

    loadData();
  </script>
</body>
</html>
